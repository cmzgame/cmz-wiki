name: Build and publish the wiki

# A push builds and publishes the site. An issue titled "Verify: <page title>" opened by Michael's account (the
# repository variable VERIFIER, else michaeldippold; the repository's owner is the studio's organisation since 2026-10-15)
# (the Verify button on every page opens one) stamps that page verified in verified.json, closes the issue,
# and publishes. Pushes made by this workflow's own token do not start workflows, so the verify job and the
# build run in the same workflow, the build after the stamp.

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'Verify:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Stamp the page
        env:
          TITLE: ${{ github.event.issue.title }}
          AUTHOR: ${{ github.event.issue.user.login }}
          VERIFIER: ${{ vars.VERIFIER || 'michaeldippold' }}
          NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$AUTHOR" != "$VERIFIER" ]; then
            gh issue close "$NUMBER" --comment "Only Michael can verify a page." --reason "not planned"
            exit 0
          fi
          PAGE="${TITLE#Verify:}"
          PAGE="$(echo "$PAGE" | sed 's/^ *//;s/ *$//')"
          # The build writes every page's fingerprint (its text, site/fingerprints.json); the stamp keeps it beside the
          # time, and a later build that finds the page's text different shows "Changed since verified".
          node build.js || { gh issue comment "$NUMBER" --body "The wiki failed to build, so **$PAGE** was not stamped; the Actions log has the error."; exit 1; }
          if ! node -e 'const p = JSON.parse(require("fs").readFileSync("site/fingerprints.json", "utf8")); process.exit(process.argv[1] in p ? 0 : 1)' "$PAGE"; then
            gh issue close "$NUMBER" --comment "No page is titled **$PAGE**; nothing was stamped. The Verify button on the page fills in its exact title." --reason "not planned"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const page = process.argv[1];
            const file = "verified.json";
            const v = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : {};
            const prints = JSON.parse(fs.readFileSync("site/fingerprints.json", "utf8"));
            v[page] = { at: new Date().toISOString(), print: prints[page] };
            const sorted = Object.fromEntries(Object.keys(v).sort().map((k) => [k, v[k]]));
            fs.writeFileSync(file, JSON.stringify(sorted, null, 2) + "\n");
          ' "$PAGE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verified.json
          git commit -m "Verified: $PAGE (#$NUMBER)"
          git push
          gh issue close "$NUMBER" --comment "Stamped **$PAGE** verified. The site republishes in a minute or two."

  build:
    needs: verify
    if: always() && (github.event_name != 'issues' || needs.verify.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node build.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
